<!-- webapp/templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GRID GUARD — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="login-page">
 
  <div class="login-container">
    <div class="login-box">
 
      <div class="login-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V6L12 2z"/>
          </svg>
        </div>
        <h1>GRID GUARD</h1>
        <p>AI-Powered Threat Detection &amp; Response</p>
      </div>
 
      {% if error %}
      <div class="login-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}
 
      <form class="login-form" method="POST" action="/login">
 
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="admin@gridguard.com"
              required
              autocomplete="email"
            />
          </div>
        </div>
 
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>
        </div>
 
        <div class="login-extras">
          <label class="remember-wrap">
            <input type="checkbox" name="remember"/>
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
 
        <button type="submit" class="btn-login">Sign In</button>
 
      </form>
 
      <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--border);">
        <p style="font-size:0.68rem; color:var(--text-muted); text-align:center; font-family:'Source Code Pro',monospace; margin-bottom:8px;">
          DEMO CREDENTIALS
        </p>
        <div style="display:flex; flex-direction:column; gap:4px;">
          <p style="font-size:0.68rem; color:var(--text-muted); font-family:'Source Code Pro',monospace; text-align:center;">
            admin@gridguard.com / gridguard123
          </p>
          <p style="font-size:0.68rem; color:var(--text-muted); font-family:'Source Code Pro',monospace; text-align:center;">
            operator@gridguard.com / operator123
          </p>
        </div>
      </div>
 
    </div>
  </div>
 
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
